<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오픈톡 RPG 레이드 프로토타입</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e13;color:#eef2f7;font-family:system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}h1{font-size:42px;margin:0}.muted{color:#94a0b2}.card{background:#141922;border:1px solid #2a3340;border-radius:16px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setup{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}label{font-size:12px;color:#aab5c4}select,input{width:100%;margin-top:6px;background:#0c1117;color:#eef2f7;border:1px solid #334052;border-radius:9px;padding:10px}.bar{height:11px;background:#090c10;border:1px solid #303a48;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#69baff;width:0}.hp i{background:#e36557}.boss i{background:#f08c52}.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.actions button,.start{border:1px solid #354255;background:#101720;color:#eef2f7;border-radius:11px;padding:12px 8px;cursor:pointer}.actions button{min-height:70px}.actions button:disabled{opacity:.35;cursor:not-allowed}.start{width:100%;margin-top:12px;background:#f0a64b;color:#1d1308;font-weight:900;border:0}.energy{display:flex;gap:6px}.energy i{width:13px;height:13px;border-radius:50%;background:#303a48}.energy i.on{background:#67baff;box-shadow:0 0 10px #4ca7ff}.log{height:280px;overflow:auto;background:#090d12;border:1px solid #252e39;border-radius:10px;padding:10px;font-family:monospace;font-size:12px}.log p{margin:0;padding:6px;border-bottom:1px solid #171d25}.big{font-size:28px;font-weight:900}.warning{color:#ff9a85}@media(max-width:760px){.grid,.setup{grid-template-columns:1fr}.actions{grid-template-columns:repeat(2,1fr)}h1{font-size:34px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="muted">KAKAO OPENCHAT RPG · V0.1</div><h1>보스 10턴 레이드</h1><p class="muted">보스가 10번 행동하면 종료. 속도가 높을수록 그 사이 내 턴이 더 자주 옵니다.</p></div><b id="state">준비</b></div>
<section class="card"><div class="setup">
<label>무기<select id="weapon"></select></label>
<label>신발 속도 보너스<input id="speed" type="range" min="0" max="80" step="5" value="20"><span id="sv">+20</span></label>
<label>스킬 세팅<select id="preset"></select></label>
</div><button class="start" id="start">레이드 시작 / 다시 시작</button></section>
<section class="grid">
<div class="card"><div class="row"><b>내 캐릭터</b><span id="acts">행동 0회</span></div><div class="row"><small>HP</small><span id="hptext"></span></div><div class="bar hp"><i id="hp"></i></div><div class="row"><small>행동게이지</small><span id="pgtext"></span></div><div class="bar"><i id="pg"></i></div><p>속도 <b id="spd"></b></p><div class="energy" id="energy"></div></div>
<div class="card"><div class="row"><b>적룡 발가르</b><span id="turns">0 / 10턴</span></div><div class="row"><small>레이드 진행</small><span id="forecast">기본 공격</span></div><div class="bar boss"><i id="tb"></i></div><div class="row"><small>보스 행동게이지</small><span id="bgtext"></span></div><div class="bar"><i id="bg"></i></div><p>누적 피해</p><div class="big" id="damage">0</div></div>
</section>
<section class="card"><div class="actions">
<button data-a="basic"><b>기본공격</b><br><small>에너지 +1</small></button>
<button data-a="skill" data-s="0"><b id="s0"></b><br><small id="c0"></small></button>
<button data-a="skill" data-s="1"><b id="s1"></b><br><small id="c1"></small></button>
<button data-a="skill" data-s="2"><b id="s2"></b><br><small id="c2"></small></button>
<button data-a="evade"><b>회피</b><br><small>성공→다음 공격 ×2</small></button>
<button data-a="defend"><b>방어</b><br><small>성공→피해 0 + 에너지</small></button>
</div></section>
<section class="card"><div class="log" id="log"></div></section>
</main>
<script>
const weapons={
 sword:{n:"검",m:1,h:1,spd:1},greatsword:{n:"대검",m:1.38,h:1,spd:.86},spear:{n:"창",m:1.05,h:1,spd:.98,pen:.12},
 dual:{n:"쌍검",m:.62,h:2,spd:1.12},bow:{n:"활",m:.96,h:1,spd:1.03,crit:.10},dagger:{n:"단검",m:.74,h:1,spd:1.18,crit:.08},
 axe:{n:"도끼",m:1.18,h:1,spd:.93,pen:.16},hammer:{n:"망치",m:1.3,h:1,spd:.84,pen:.22},wand:{n:"지팡이",m:.88,h:1,spd:1.02,magic:true},
 staff:{n:"스태프",m:1.05,h:1,spd:.94,magic:true},gauntlet:{n:"건틀릿",m:.58,h:2,spd:1.14},scythe:{n:"낫",m:1.08,h:1,spd:.96}
};
const presets={
 sword:[["강베기",2,1.85],["발도",2,1.3,25],["검무",4,.72,0,4]],
 greatsword:[["강베기",2,1.85],["거신분쇄",4,2.75],["처형",3,2.2]],
 spear:[["꿰뚫기",2,1.65],["연환창",3,.75,15,3],["돌진",3,1.8,25]],
 dual:[["난무",4,.52,0,6],["혈절",3,1.35],["그림자걸음",2,0,65]],
 bow:[["조준사격",2,1.75],["연사",3,.58,0,4],["관통사격",3,1.95]],
 dagger:[["급소찌르기",2,1.55],["그림자걸음",2,0,65],["혈절",3,1.35]],
 axe:[["강베기",2,1.85],["방어파괴",3,1.25],["처형",3,2.2]],
 hammer:[["철권",2,1.55],["방어파괴",3,1.25],["대지분쇄",4,2.15]],
 wand:[["화염구",2,1.7],["낙뢰",3,2.2],["마력순환",0,0,15]],
 staff:[["얼음창",2,1.45],["연쇄번개",4,.85,0,3],["마력폭발",4,2.55]],
 gauntlet:[["철권",2,1.55],["백열권",4,.38,0,8],["가속",3,0,35]],
 scythe:[["혈절",3,1.35],["암흑파",3,2],["영혼수확",4,2.2]]
};
let G=null; const $=s=>document.querySelector(s);
Object.entries(weapons).forEach(([id,w])=>weapon.add(new Option(w.n,id)));
weapon.value="bow"; preset.add(new Option("추천 3스킬","recommended"));
speed.oninput=()=>sv.textContent="+"+speed.value;
weapon.onchange=labels; function labels(){const p=presets[weapon.value];p.forEach((x,i)=>{$("#s"+i).textContent=x[0];$("#c"+i).textContent="에너지 "+x[1]})}labels();
function rnd(){G.r=(G.r*1664525+1013904223)>>>0;return G.r/4294967296}
function log(x){G.log.push(x); if(G.log.length>60)G.log.shift()}
function hit(atk,mul,hits=1,pen=0,crit=0){let sum=0;for(let i=0;i<hits;i++){let mit=100/(100+G.bdef*(1-pen)*4.5);let d=atk*mul*mit*(.93+rnd()*.14);if(rnd()<.08+crit)d*=1.55;sum+=Math.max(1,Math.round(d))}G.dmg+=sum;return sum}
function advance(){while(!G.done){if(G.pg>=100-1e-9){G.pg=100;G.wait=true;log("⚡ 내 턴 — 에너지 "+G.e+"/"+G.em);return}if(G.bg>=100-1e-9){G.bg-=100;boss();if(G.done)return;continue}let dt=Math.min((100-G.pg)/G.ps,(100-G.bg)/100);G.pg+=G.ps*dt;G.bg+=100*dt;if(G.pg>=100-1e-9&&G.bg>=100-1e-9){G.pg=100;G.wait=true;return}}}
function boss(){G.bt++;let heavy=G.bt%4===0,m=heavy?1.75:1;if(G.ev){let ok=rnd()<.56;if(ok){G.e=Math.min(G.em,G.e+1);G.next=2;log("🌪 회피 성공! 다음 공격 ×2")}else{let d=Math.round(32*m*100/(100+22*4.5));G.hp-=d;log("🌪 회피 실패 → "+d+" 피해")}G.ev=false}else if(G.gu){let ok=rnd()<.70;if(ok){G.e=Math.min(G.em,G.e+2);log("🛡 방어 성공! 피해 0 / 에너지 +2")}else{let d=Math.round(32*m*.65*100/(100+22*4.5));G.hp-=d;log("🛡 방어 실패 → "+d+" 피해")}G.gu=false}else{let d=Math.round(32*m*100/(100+22*4.5));G.hp-=d;log((heavy?"🔥 강공격":"🐲 보스 공격")+" → "+d+" 피해")}if(G.hp<=0){finish("전투 불능");return}if(G.bt>=10){finish("보스 10턴 종료");return}}
function finish(reason){G.done=true;G.wait=false;log("🏁 "+reason+" / 내 행동 "+G.pa+"회 / 누적 피해 "+G.dmg.toLocaleString())}
function act(a,slot){if(!G||!G.wait||G.done)return;G.wait=false;G.pg=Math.max(0,G.pg-100);G.pa++;if(a==="basic"){let w=weapons[G.w],atk=w.magic?42:42,d=hit(atk,w.m,w.h,w.pen||0,w.crit||0)*G.next; if(G.next>1){G.dmg-=Math.round(d/G.next);G.dmg+=Math.round(d);log("⚔ "+w.n+" 기본공격 → "+Math.round(d)+" 피해 (증폭)")}else log("⚔ "+w.n+" 기본공격 → "+Math.round(d)+" 피해");G.next=1;G.e=Math.min(G.em,G.e+1)}else if(a==="defend"){G.gu=true;log("🛡 방어 자세")}else if(a==="evade"){G.ev=true;log("🌪 회피 준비")}else{let s=presets[G.w][slot];if(G.e<s[1]){G.wait=true;return}G.e-=s[1];if(s[2]>0){let d=hit(42,s[2],s[4]||1,0,0)*G.next;if(G.next>1){G.dmg-=Math.round(d/G.next);G.dmg+=Math.round(d)}log("✨ "+s[0]+" → "+Math.round(d)+" 피해");G.next=1}else{log("✨ "+s[0]+" 사용");if(s[0]==="마력순환")G.e=Math.min(G.em,G.e+3)}if(s[3]){G.pg=Math.min(99.999,G.pg+s[3]);log("⏱ 행동게이지 +"+s[3])}}advance();render()}
function startRaid(){let w=weapons[weapon.value];G={w:weapon.value,ps:(100+Number(speed.value))*w.spd,pg:0,bg:0,bt:0,pa:0,hp:330,maxhp:330,e:2,em:6,dmg:0,bdef:26,next:1,ev:false,gu:false,wait:false,done:false,r:(Date.now()>>>0),log:[]};log("🐲 적룡 발가르 레이드 시작");advance();render()}
function render(){if(!G){document.querySelectorAll(".actions button").forEach(b=>b.disabled=true);return}hp.style.width=Math.max(0,G.hp/G.maxhp*100)+"%";hptext.textContent=Math.max(0,G.hp)+" / "+G.maxhp;pg.style.width=Math.min(100,G.pg)+"%";pgtext.textContent=Math.floor(G.pg)+" / 100";bg.style.width=Math.min(100,G.bg)+"%";bgtext.textContent=Math.floor(G.bg)+" / 100";tb.style.width=G.bt*10+"%";turns.textContent=G.bt+" / 10턴";acts.textContent="행동 "+G.pa+"회";damage.textContent=G.dmg.toLocaleString();spd.textContent=Math.round(G.ps);forecast.textContent=(G.bt+1)%4===0?"⚠ 강공격":"기본 공격";energy.innerHTML=Array.from({length:G.em},(_,i)=>'<i class="'+(i<G.e?'on':'')+'"></i>').join("");document.querySelectorAll(".actions button").forEach(b=>{b.disabled=!G.wait||G.done;if(b.dataset.a==="skill"&&G.wait){let s=presets[G.w][+b.dataset.s];if(G.e<s[1])b.disabled=true}});state.textContent=G.done?"종료":G.wait?"내 턴":"진행";logEl.innerHTML=G.log.map(x=>"<p>"+x+"</p>").join("");logEl.scrollTop=logEl.scrollHeight}
const logEl=$("#log");document.querySelectorAll(".actions button").forEach(b=>b.onclick=()=>act(b.dataset.a,+b.dataset.s));start.onclick=startRaid;render();
</script></body></html>
