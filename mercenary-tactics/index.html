<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>흐린 달의 용병단 — 2.5D Tactical Prototype</title><link rel="stylesheet" href="./style.css?v=8"></head><body>
<div class="shell">
<header class="title panel"><div class="gameTitle">흐린 달의 용병단<small>MERCENARY TACTICAL PROTOTYPE</small></div><div class="turn"><strong id="turnLabel">DEPLOY</strong><span id="phaseText">용병을 배치하십시오.</span></div><div class="mapName">침수된 교량</div></header>
<aside class="left panel"><div class="heroVisual"><div class="heroGlow"></div><div class="heroFace" id="heroFace"></div></div><div class="heroInfo"><div class="heroName" id="heroName">세라 <span>Lv.12</span></div><div class="hpLine"><i id="heroHpBar"></i></div><div class="role" id="heroRole">⚔ 검사</div><div class="quote" id="heroQuote">“여기서도, 제가 지키겠습니다.”</div><div class="miniStats"><div>공격력 <b id="stAtk">32</b></div><div>방어력 <b id="stDef">18</b></div><div>이동력 <b id="stMv">3</b></div><div>사거리 <b id="stRg">1</b></div></div></div></aside>
<main class="center panel"><div class="stage"><div class="world"><div class="board" id="board"><div class="unitLayer" id="units"></div></div></div></div></main>
<aside class="right panel"><div class="enemyParty"><h3>적 용병단</h3><div class="avatars" id="enemyAvatars"></div></div><div class="terrainCard"><strong>지형 효과</strong><p>강은 이동 불가 · 다리로만 통과<br>숲은 이동 비용 2 · 받는 피해 25% 감소</p></div><div class="deployBtns" id="deployBtns"><button id="reroll">전장 재생성</button><button class="start" id="start">배치 완료</button></div><div class="actions"><button class="action" id="move">이동</button><button class="action" id="attack">공격</button><button class="action" id="skill">스킬</button><button class="action" id="wait">대기</button><button class="endTurn" id="end">턴 종료</button></div></aside>
<footer class="bottom panel"><div class="objective"><b>승리 조건</b>적 용병단 전멸<br>8×8 · 랜덤 강/다리/숲/바위</div><div class="party" id="party"></div><div class="log" id="log"></div></footer>
</div><div class="overlay" id="overlay"><div class="modal"><h2 id="result"></h2><p id="resultText"></p><button id="again">새 전투</button></div></div><script src="./assets1.js?v=8"></script><script src="./assets2.js?v=8"></script><script src="./assets3.js?v=8"></script><script src="./assets4.js?v=8"></script><script src="./sera_sd_override.js?v=8"></script><script src="./game.js?v=8"></script><script src="./sera_billboard_fix.js?v=8"></script></body></html>
