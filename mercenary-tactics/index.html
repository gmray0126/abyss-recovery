<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>흐린 달의 용병단 - 전술 프로토타입</title><style>
*{box-sizing:border-box}body{margin:0;background:#10130f;color:#eee9db;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button{font:inherit;color:inherit}.app{min-height:100vh;max-width:1250px;margin:auto;padding:10px;display:grid;grid-template-columns:minmax(520px,1fr) 270px;gap:10px}.panel{background:#191c17;border:1px solid #55574e;border-radius:10px;box-shadow:0 12px 35px #0008}.main{display:flex;flex-direction:column}.top{height:62px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.top h1{font:700 22px Georgia,serif;margin:0}.top small{color:#a7a294}.phase{padding:7px 10px;border:1px solid #686354;border-radius:7px;background:#10120e;color:#e3c98c}.frame{flex:1;min-height:610px;display:grid;place-items:center;padding:18px;background:radial-gradient(circle,#30382a,#11150f 72%)}.board{width:min(78vh,100%);aspect-ratio:1;position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:3px solid #81775f;box-shadow:0 20px 50px #000c}.cell{position:relative;border:1px solid #263020;background:linear-gradient(135deg,#687258,#4f5946);cursor:pointer;overflow:hidden}.cell.pz{box-shadow:inset 0 0 0 999px #2d71824d}.cell.ez{box-shadow:inset 0 0 0 999px #8a36384b}.cell.forest{background:radial-gradient(circle at 30% 30%,#244125 0 18%,transparent 19%),radial-gradient(circle at 70% 65%,#29472b 0 22%,transparent 23%),#4c5b43}.cell.forest:after{content:"♣";position:absolute;inset:0;display:grid;place-items:center;color:#e4efd33d;font-size:32px}.cell.rock{background:#5c5e52}.cell.rock:after{content:"◆";position:absolute;inset:0;display:grid;place-items:center;color:#2e3029;font-size:38px;text-shadow:8px 5px #838476}.cell.river{background:repeating-linear-gradient(165deg,#6bc4d8 0 6px,#439ab8 6px 12px);animation:w 3s linear infinite}.cell.river:after{content:"≈";position:absolute;inset:0;display:grid;place-items:center;color:#eaffff99;font-size:30px}@keyframes w{to{background-position:40px 0}}.cell.bridge{background:repeating-linear-gradient(90deg,#765535 0 10%,#aa8254 10% 20%);box-shadow:inset 0 7px #3d8aa8,inset 0 -7px #3d8aa8}.cell.bridge:after{content:"";position:absolute;left:0;right:0;top:28%;bottom:28%;border-block:2px solid #3b2b1a}.cell.move{box-shadow:inset 0 0 0 4px #88d6f2,inset 0 0 24px #5db3dc99!important;z-index:2}.cell.skill{box-shadow:inset 0 0 0 4px #cb91f0!important;z-index:2}.units{position:absolute;inset:0;pointer-events:none;z-index:5}.unit{position:absolute;width:12.5%;height:12.5%;padding:5px;transition:left .24s,top .24s,transform .15s;pointer-events:auto;cursor:pointer}.token{width:100%;height:100%;border-radius:10px;border:3px solid #65c7b0;background:#191d18;box-shadow:0 7px 12px #000a;display:grid;place-items:center;font-size:26px;position:relative}.enemy .token{border-color:#dc6c72}.unit.sel{transform:translateY(-5px) scale(1.07);z-index:20}.unit.sel .token{box-shadow:0 0 0 3px #ead090,0 8px 15px #000}.unit.acted{filter:brightness(.55) saturate(.55)}.unit.attackable .token{box-shadow:0 0 0 3px #ff747c,0 0 17px #f44}.unit.healable .token{box-shadow:0 0 0 3px #70e8a3,0 0 17px #4d8}.hp{position:absolute;left:6%;right:6%;bottom:2px;height:7px;border-radius:99px;background:#220e0e;overflow:hidden;border:1px solid #000}.hp i{height:100%;display:block;background:#5bcea0}.enemy .hp i{background:#d96267}.shield{position:absolute;right:1px;top:1px;background:#74aee0;border-radius:99px;padding:2px 4px;font-size:8px;font-weight:800}.log{height:105px;padding:9px 12px;overflow:auto;font-size:12px;color:#c7c3b8;line-height:1.5}.log b{color:#e1c47e}.side{padding:12px;display:flex;flex-direction:column;gap:9px}.char{padding:12px;background:#11140f;border:1px solid #3e4239;border-radius:8px}.portrait{height:145px;display:grid;place-items:center;font-size:70px;background:radial-gradient(circle,#3b4038,#171a15);border-radius:8px;margin-bottom:8px}.charhead{display:flex;justify-content:space-between}.charhead b{font:700 20px Georgia,serif}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}.stats div{padding:6px;background:#0d0f0c;border-radius:5px;font-size:11px;color:#aaa}.stats strong{float:right;color:#eee}.skilldesc{margin-top:8px;font-size:11px;line-height:1.5;color:#c6c1b4}.deploy{display:flex;gap:6px}.deploy button,.act,.end{border:1px solid #5b594e;background:#262921;padding:10px;border-radius:7px;cursor:pointer}.deploy button{flex:1;font-size:11px}.deploy .start{background:#443723;border-color:#b49a6b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.act{font-size:12px}.act.active{border-color:#e1c47e;box-shadow:inset 0 0 0 1px #e1c47e}.act:disabled,.end:disabled{filter:brightness(.45);cursor:not-allowed}.end{margin-top:auto;background:#3b3022;border-color:#9e8055;font-weight:800}.tip{font-size:10px;color:#9a968b;line-height:1.55}.float{position:absolute;z-index:50;font-weight:900;font-size:22px;text-shadow:0 2px 3px #000;animation:f .8s forwards}.dmg{color:#ff7f87}.heal{color:#77ecaa}@keyframes f{to{opacity:0;transform:translateY(-40px)}}.overlay{position:fixed;inset:0;background:#080a07e8;z-index:100;display:none;place-items:center}.overlay.show{display:grid}.modal{width:min(440px,90vw);background:#1b1e18;border:1px solid #666355;border-radius:12px;padding:24px;text-align:center}.modal h2{font:800 32px Georgia,serif}.modal button{width:100%;padding:11px;background:#403421;border:1px solid #9d8155;border-radius:7px;color:#eee}@media(max-width:800px){.app{display:flex;flex-direction:column;padding:5px}.frame{min-height:0;padding:8px}.board{width:min(97vw,72vh)}.side{display:grid;grid-template-columns:1fr 1fr}.char{display:none}.actions{grid-column:1/-1;grid-template-columns:repeat(4,1fr)}.end{grid-column:1/-1}.tip{display:none}.log{height:78px}}
</style></head><body><div class="app"><main class="main"><div class="top panel"><div><h1>흐린 달의 용병단</h1><small>8×8 TACTICAL PROTOTYPE · 침수된 교량</small></div><div class="phase" id="phase">배치 단계 · TURN 0</div></div><div class="frame panel"><div class="board" id="board"><div class="units" id="units"></div></div></div><div class="log panel" id="log"></div></main><aside class="side panel"><div class="char"><div class="portrait" id="portrait">👩🏻‍🦳</div><div class="charhead"><b id="name">세라</b><span id="cls">검사</span></div><div class="stats"><div>HP <strong id="hp">120/120</strong></div><div>공격 <strong id="atk">32</strong></div><div>이동 <strong id="mov">3</strong></div><div>사거리 <strong id="rng">1</strong></div></div><div class="skilldesc" id="skilldesc"><b>돌파</b><br>2칸 이내 적에게 48 피해.</div></div><div class="deploy" id="deploy"><button id="reroll">맵 다시 생성</button><button class="start" id="start">전투 시작</button></div><div class="actions"><button class="act" id="move">✥ 이동</button><button class="act" id="attack">⚔ 공격</button><button class="act" id="skill">✦ 스킬</button><button class="act" id="wait">⌛ 대기</button></div><div class="tip">숲: 이동 비용 2 / 받는 피해 25% 감소<br>바위·강: 이동 불가 / 다리로만 강을 건널 수 있음<br><br>배치 단계에서는 아군을 눌러 앞 2줄의 빈 칸으로 옮길 수 있습니다.</div><button class="end" id="end">턴 종료</button></aside></div><div class="overlay" id="ov"><div class="modal"><h2 id="result"></h2><p id="resulttext"></p><button id="again">새 전투</button></div></div><script>
const H=[{id:'s',name:'세라',cls:'검사',face:'👩🏻‍🦳',max:120,hp:120,atk:32,mv:3,rng:1,sk:'돌파',st:'damage',sp:48,sr:2,sd:'2칸 이내 적에게 48 피해.'},{id:'r',name:'리아',cls:'수호기사',face:'👸🏻',max:155,hp:155,atk:22,mv:2,rng:1,sk:'수호 태세',st:'shield',sp:55,sd:'보호막 55를 얻습니다.'},{id:'y',name:'유나',cls:'궁수',face:'👩🏻‍🦰',max:92,hp:92,atk:28,mv:3,rng:3,sk:'저격',st:'damage',sp:46,sr:5,sd:'5칸 이내 적에게 46 피해.'},{id:'c',name:'시아',cls:'사제',face:'👱🏻‍♀️',max:100,hp:100,atk:19,mv:3,rng:2,sk:'치유',st:'heal',sp:45,sr:3,sd:'3칸 이내 아군 HP 45 회복.'}];
const E=[{id:'e1',name:'카렌',cls:'적 검사',face:'🧝🏻‍♀️',max:112,hp:112,atk:30,mv:3,rng:1},{id:'e2',name:'노아',cls:'적 마도사',face:'🧙🏻‍♀️',max:88,hp:88,atk:31,mv:2,rng:3},{id:'e3',name:'미아',cls:'적 기사',face:'👩🏻‍🦳',max:140,hp:140,atk:23,mv:2,rng:1},{id:'e4',name:'루루',cls:'적 궁수',face:'👩🏻‍🦰',max:86,hp:86,atk:27,mv:3,rng:3}];
const $=q=>document.querySelector(q),K=(r,c)=>r+','+c,D=[[1,0],[-1,0],[0,1],[0,-1]],sleep=m=>new Promise(r=>setTimeout(r,m));let S;
function mk(b,t,r,c){return {...b,hp:b.max,shield:0,team:t,row:r,col:c,acted:false,moved:false,alive:true}}
function terrain(){let t=Array.from({length:8},()=>Array(8).fill('plain')),y=2+Math.floor(Math.random()*4),prev=y,straight=[];for(let c=0;c<8;c++){if(c){prev=y;let z=Math.random();if(z<.27&&y>2)y--;else if(z>.73&&y<5)y++}if(!c||y===prev)straight.push(c);let a=c?prev:y;for(let r=Math.min(a,y);r<=Math.max(a,y);r++)t[r][c]='river'}let cs=straight.filter(c=>c>0&&c<7).sort(()=>Math.random()-.5);if(cs.length<2)cs=[2,5];let prot=new Set;for(let c of cs.slice(0,2)){let r=[2,3,4,5].find(r=>t[r][c]=='river');if(r!=null){t[r][c]='bridge';for(let q of [r-1,r+1])if(q>=2&&q<=5)prot.add(K(q,c))}}let f=[];for(let r=2;r<=5;r++)for(let c=0;c<8;c++)if(t[r][c]=='plain'&&!prot.has(K(r,c)))f.push([r,c]);f.sort(()=>Math.random()-.5);for(let i=0,n=4+Math.floor(Math.random()*4);i<n&&f.length;i++){let [r,c]=f.pop();t[r][c]='forest'}for(let i=0,n=2+Math.floor(Math.random()*3);i<n&&f.length;i++){let [r,c]=f.pop();t[r][c]='rock'}return t}
function units(){let pc=[1,3,5,6].sort(()=>Math.random()-.5),ec=[0,2,4,7].sort(()=>Math.random()-.5);return[...H.map((x,i)=>mk(x,'p',i<2?7:6,pc[i])),...E.map((x,i)=>mk(x,'e',i<2?0:1,ec[i]))]}
function init(){S={ph:'deploy',turn:0,t:terrain(),u:units(),sel:null,mode:'move',busy:false,over:false};$('#ov').classList.remove('show');$('#deploy').style.display='flex';$('#log').innerHTML='';cells();log('<b>배치 단계</b>입니다. 아군을 선택해 아래 2줄에서 위치를 바꿔보세요.');render()}
function cells(){let b=$('#board');b.querySelectorAll('.cell').forEach(x=>x.remove());for(let r=0;r<8;r++)for(let c=0;c<8;c++){let d=document.createElement('div');d.className='cell '+(r<=1?'ez ':'')+(r>=6?'pz ':'')+(S.t[r][c]!='plain'?S.t[r][c]:'');d.dataset.r=r;d.dataset.c=c;d.onclick=()=>cell(r,c);b.insertBefore(d,$('#units'))}}
function get(id){return S.u.find(x=>x.id===id)}function alive(t){return S.u.filter(x=>x.team===t&&x.alive)}function occ(r,c,ig){return S.u.find(x=>x.alive&&x.id!==ig&&x.row===r&&x.col===c)}function pass(r,c){return r>=0&&r<8&&c>=0&&c<8&&!['river','rock'].includes(S.t[r][c])}function cost(r,c){return S.t[r][c]=='forest'?2:1}function dist(a,b){return Math.abs(a.row-b.row)+Math.abs(a.col-b.col)}function range(a,b,n=a.rng){return dist(a,b)<=n}
function log(s){let d=document.createElement('div');d.innerHTML=s;$('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight}
function reach(u){let best=new Map([[K(u.row,u.col),0]]),q=[{r:u.row,c:u.col,n:0}];while(q.length){q.sort((a,b)=>a.n-b.n);let x=q.shift();for(let [dr,dc] of D){let r=x.r+dr,c=x.c+dc;if(!pass(r,c)||occ(r,c,u.id))continue;let n=x.n+cost(r,c);if(n>u.mv)continue;let k=K(r,c);if(!best.has(k)||n<best.get(k)){best.set(k,n);q.push({r,c,n})}}}best.delete(K(u.row,u.col));return best}
function select(id){let u=get(id);if(!u||!u.alive||S.ph=='player'&&u.team!='p')return;S.sel=id;S.mode='move';render()}
function cell(r,c){if(S.busy)return;let o=occ(r,c),u=get(S.sel);if(S.ph=='deploy'){if(o?.team=='p')return select(o.id);if(u&&r>=6&&!o){u.row=r;u.col=c;log(u.name+' 배치 변경.');render()}return}if(S.ph!='player')return;if(o){if(o.team=='p')return select(o.id);if(!u||u.acted)return;if(S.mode=='attack'&&range(u,o))return attack(u,o);if(S.mode=='skill')return skillOn(u,o)}if(u&&!u.acted&&!u.moved&&S.mode=='move'&&reach(u).has(K(r,c))){u.row=r;u.col=c;u.moved=true;S.mode='attack';log(u.name+' 이동.');render()}}
function damage(a,t,n,label){if(S.t[t.row][t.col]=='forest')n=Math.ceil(n*.75);let b=Math.min(t.shield,n);t.shield-=b;n-=b;t.hp=Math.max(0,t.hp-n);float(t,'-'+n,'dmg');log(a.name+'의 '+label+' → '+t.name+' <b>'+n+' 피해</b>'+(S.t[t.row][t.col]=='forest'?' (숲 엄폐)':''));if(t.hp<=0){t.alive=false;log('<b>'+t.name+'</b> 전투 불능.')}endcheck()}
function attack(a,t){if(a.acted||!range(a,t))return;damage(a,t,a.atk,'공격');a.acted=a.moved=true;S.mode='move';render();auto()}
function skill(){let u=get(S.sel);if(!u||u.acted||S.ph!='player')return;if(u.st=='shield'){u.shield+=u.sp;u.acted=u.moved=true;log(u.name+' <b>'+u.sk+'</b> · 보호막 '+u.sp);render();auto()}else{S.mode='skill';log('<b>'+u.sk+'</b> 대상 선택.');render()}}
function skillOn(u,t){if(u.acted)return;if(u.st=='damage'&&t.team=='e'&&range(u,t,u.sr)){damage(u,t,u.sp,u.sk);u.acted=u.moved=true;S.mode='move';render();auto()}else if(u.st=='heal'&&t.team=='p'&&range(u,t,u.sr)){let h=Math.min(u.sp,t.max-t.hp);t.hp+=h;float(t,'+'+h,'heal');log(u.name+'의 <b>'+u.sk+'</b> → '+t.name+' '+h+' 회복');u.acted=u.moved=true;S.mode='move';render();auto()}}
function wait(){let u=get(S.sel);if(!u||u.acted||S.ph!='player')return;u.acted=u.moved=true;log(u.name+' 대기.');render();auto()}function auto(){if(alive('p').every(x=>x.acted))setTimeout(enemyturn,250)}
function float(u,x,cl){let f=document.createElement('div');f.className='float '+cl;f.textContent=x;f.style.left=((u.col+.45)*12.5)+'%';f.style.top=((u.row+.25)*12.5)+'%';$('#units').appendChild(f);setTimeout(()=>f.remove(),850)}
function step(e,t){let q=[{r:e.row,c:e.col,n:0,path:[]}],best=new Map([[K(e.row,e.col),0]]),bn=q[0],bd=dist(e,t);while(q.length){q.sort((a,b)=>a.n-b.n);let x=q.shift(),d=Math.abs(x.r-t.row)+Math.abs(x.c-t.col);if(d<bd){bd=d;bn=x}if(x.n>=e.mv)continue;for(let [dr,dc] of D){let r=x.r+dr,c=x.c+dc;if(!pass(r,c)||occ(r,c,e.id))continue;let n=x.n+cost(r,c),k=K(r,c);if(n>e.mv||best.has(k)&&best.get(k)<=n)continue;best.set(k,n);q.push({r,c,n,path:[...x.path,[r,c]]})}}return bn.path.length?bn.path.at(-1):null}
async function enemyturn(){if(S.ph!='player'||S.busy)return;S.ph='enemy';S.busy=true;S.sel=null;render();log('<b>적 턴</b>');await sleep(350);for(let e of alive('e')){let ts=alive('p').filter(p=>range(e,p));if(!ts.length){let n=[...alive('p')].sort((a,b)=>dist(e,a)-dist(e,b))[0],s=n&&step(e,n);if(s){e.row=s[0];e.col=s[1];render();await sleep(260)}ts=alive('p').filter(p=>range(e,p))}if(ts.length){ts.sort((a,b)=>a.hp-b.hp);damage(e,ts[0],e.atk,'공격');render();await sleep(280)}if(S.over)break}if(!S.over){S.turn++;S.ph='player';S.busy=false;alive('p').forEach(x=>x.acted=x.moved=false);S.sel=alive('p')[0]?.id;log('<b>TURN '+S.turn+'</b> 아군 행동.');render()}}
function endcheck(){if(S.over)return true;if(!alive('e').length){finish(true);return true}if(!alive('p').length){finish(false);return true}return false}
function finish(w){S.over=S.busy=true;setTimeout(()=>{$('#ov').classList.add('show');$('#result').textContent=w?'승리':'패배';$('#resulttext').innerHTML=w?'적 용병단을 전멸시켰습니다.<br>강·다리·숲은 새 전투마다 다시 생성됩니다.':'배치와 다리 위치를 다시 확인해 보세요.'},300)}
function start(){S.ph='player';S.turn=1;S.sel=alive('p')[0].id;$('#deploy').style.display='none';log('<b>TURN 1</b> 전투 시작.');render()}function reroll(){S.t=terrain();S.u=units();S.sel=null;cells();log('전장을 다시 생성했습니다.');render()}
function render(){let u=get(S.sel);$('#phase').textContent=(S.ph=='deploy'?'배치 단계':S.ph=='player'?'아군 행동':'적 행동')+' · TURN '+S.turn;document.querySelectorAll('.cell').forEach(x=>{x.classList.remove('move','skill');let r=+x.dataset.r,c=+x.dataset.c;if(u&&S.ph=='player'&&!u.acted&&!u.moved&&S.mode=='move'&&reach(u).has(K(r,c)))x.classList.add('move');if(u&&S.mode=='skill'&&((u.st=='damage'&&alive('e').some(t=>t.row==r&&t.col==c&&range(u,t,u.sr)))||(u.st=='heal'&&alive('p').some(t=>t.row==r&&t.col==c&&range(u,t,u.sr)))))x.classList.add('skill')});let L=$('#units');L.querySelectorAll('.unit').forEach(x=>x.remove());let at=u&&S.mode=='attack'?alive('e').filter(t=>range(u,t)).map(x=>x.id):u&&S.mode=='skill'&&u.st=='damage'?alive('e').filter(t=>range(u,t,u.sr)).map(x=>x.id):[],he=u&&S.mode=='skill'&&u.st=='heal'?alive('p').filter(t=>range(u,t,u.sr)).map(x=>x.id):[];for(let x of S.u){if(!x.alive)continue;let d=document.createElement('div');d.className='unit '+(x.team=='e'?'enemy ':'')+(x.id==S.sel?'sel ':'')+(x.acted?'acted ':'')+(at.includes(x.id)?'attackable ':'')+(he.includes(x.id)?'healable ':'');d.style.left=x.col*12.5+'%';d.style.top=x.row*12.5+'%';d.innerHTML='<div class="token">'+x.face+(x.shield?'<span class="shield">'+x.shield+'</span>':'')+'<span class="hp"><i style="width:'+100*x.hp/x.max+'%"></i></span></div>';d.onclick=e=>{e.stopPropagation();if(S.busy)return;if(S.ph=='deploy'&&x.team=='p')select(x.id);else if(S.ph=='player'){if(x.team=='p')select(x.id);else{let a=get(S.sel);if(a&&S.mode=='attack')attack(a,x);else if(a&&S.mode=='skill')skillOn(a,x)}}};L.appendChild(d)}u=u||alive('p')[0];if(u){$('#portrait').textContent=u.face;$('#name').textContent=u.name;$('#cls').textContent=u.cls;$('#hp').textContent=u.hp+'/'+u.max;$('#atk').textContent=u.atk;$('#mov').textContent=u.mv;$('#rng').textContent=u.rng;$('#skilldesc').innerHTML=u.team=='p'?'<b>'+u.sk+'</b><br>'+u.sd:'적 용병'}let can=S.ph=='player'&&u?.team=='p'&&!u.acted&&!S.busy;$('#move').disabled=!can||u?.moved;$('#attack').disabled=!can;$('#skill').disabled=!can;$('#wait').disabled=!can;[['move','move'],['attack','attack'],['skill','skill']].forEach(([id,m])=>$('#'+id).classList.toggle('active',can&&S.mode==m));$('#end').disabled=S.ph!='player'||S.busy}
$('#start').onclick=start;$('#reroll').onclick=reroll;$('#move').onclick=()=>{S.mode='move';render()};$('#attack').onclick=()=>{S.mode='attack';render()};$('#skill').onclick=skill;$('#wait').onclick=wait;$('#end').onclick=enemyturn;$('#again').onclick=init;init();
</script></body></html>
