name: Apply v2.7 audio patch
on:
  push:
    paths: ['tools/apply-v27-audio.mjs']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add CC0 audio assets
        run: |
          set -e
          mkdir -p assets/audio
          curl -L --fail -o assets/audio/shot-pistol.wav 'https://opengameart.org/sites/default/files/22%20Pistol.wav'
          curl -L --fail -o assets/audio/shot-rifle.wav 'https://opengameart.org/sites/default/files/22%20Magnum.wav'
          curl -L --fail -o assets/audio/shot-heavy.wav 'https://opengameart.org/sites/default/files/Black%20Powder.wav'
          curl -L --fail -o assets/audio/shot-alt.wav 'https://opengameart.org/sites/default/files/Unkown.wav'
          curl -L --fail -o assets/audio/reload-pistol.wav 'https://opengameart.org/sites/default/files/gunreload1.wav'
          curl -L --fail -o assets/audio/reload-rifle.wav 'https://opengameart.org/sites/default/files/assaultriflereload1_0.wav'
          curl -L --fail -o assets/audio/reload-shotgun.wav 'https://opengameart.org/sites/default/files/shotguncock_0.wav'
          printf '%s\n' 'CC0 audio from OpenGameArt.org' 'Gunshots: https://opengameart.org/content/gunshots' 'Reloads: https://opengameart.org/content/gun-reload-sounds' > assets/audio/SOURCES.txt
      - run: node tools/apply-v27-audio.mjs
      - run: node --check src/main.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply-v27-audio.mjs .github/workflows/apply-v27-audio.yml
          git add src/main.js assets/audio
          git commit -m 'feat: add weapon audio samples and reload UI'
          git push
