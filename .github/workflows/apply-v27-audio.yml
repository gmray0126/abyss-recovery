name: Apply v2.7 audio patch
on:
  push:
    paths: ['tools/apply-v27-audio.mjs']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add licensed audio assets
        run: |
          set -e
          mkdir -p assets/audio
          curl -L --fail --retry 3 -o assets/audio/shot-pistol.wav 'https://opengameart.org/sites/default/files/gun_shot_01.wav'
          curl -L --fail --retry 3 -o assets/audio/shot-rifle.wav 'https://opengameart.org/sites/default/files/gun_rifle_01.wav'
          curl -L --fail --retry 3 -o assets/audio/shot-rifle2.wav 'https://opengameart.org/sites/default/files/gun_rifle_02.wav'
          curl -L --fail --retry 3 -o assets/audio/reload-generic.wav 'https://opengameart.org/sites/default/files/gun_load_01.wav'
          curl -L --fail --retry 3 -o assets/audio/reload-generic2.wav 'https://opengameart.org/sites/default/files/gun_load_02.wav'
          curl -L --fail --retry 3 -o assets/audio/reload-pistol.wav 'https://opengameart.org/sites/default/files/gunreload1.wav'
          curl -L --fail --retry 3 -o assets/audio/reload-rifle.wav 'https://opengameart.org/sites/default/files/assaultriflereload1_0.wav'
          curl -L --fail --retry 3 -o assets/audio/reload-shotgun.wav 'https://opengameart.org/sites/default/files/shotguncock_0.wav'
          printf '%s\n' \
            'DEAD DROP audio sources' \
            '' \
            'Weapon shots / generic load sounds: FPS Placeholder Sounds by Jack Menhorn, CC-BY 3.0.' \
            'Source: https://opengameart.org/content/fps-placeholder-sounds' \
            'Attribution: Jack Menhorn' \
            '' \
            'Reload samples: Gun reload sounds by SpringySpringo, CC0.' \
            'Source: https://opengameart.org/content/gun-reload-sounds' \
            > assets/audio/SOURCES.txt
      - run: node tools/apply-v27-audio.mjs
      - run: node --check src/main.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply-v27-audio.mjs .github/workflows/apply-v27-audio.yml
          git add src/main.js assets/audio
          git commit -m 'feat: add weapon audio samples and reload UI'
          git push
