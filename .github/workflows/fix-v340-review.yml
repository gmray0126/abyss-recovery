name: Fix v3.4 review findings
on:
  push:
    branches:
      - feat/v340-combat-parts-maps
    paths:
      - '.github/workflows/fix-v340-review.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix AI magazine capacity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/sim.js')
          s=p.read_text(encoding='utf-8')
          old="if(a.kind!=='player'){gun.ammo=d.mag;gun.ammoTier=a.reloadTier||gun.ammoTier||1;"
          new="if(a.kind!=='player'){gun.ammo=weaponMagCapacity(gun);gun.ammoTier=a.reloadTier||gun.ammoTier||1;"
          if old not in s: raise SystemExit('AI magazine anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax and simulation stress checks
        run: |
          node --check src/sim.js
          node --check src/net.js
          node --check src/main.js
          node --check api/realtime.js
          node --check cloudflare/worker.js
          node - <<'NODE'
          import('./src/sim.js').then(m=>{
            const magWeapon={kind:'weapon',type:'ar',name:'AK-12',ammo:0,ammoTier:1,damage:24,value:820,parts:{mag:{...m.WEAPON_PARTS.ext_mag,id:'p1'}}};
            if(m.weaponMagCapacity(magWeapon)!==42) throw new Error('AR extended mag is not 42');
            const gripWeapon={kind:'weapon',type:'dmr',parts:{grip:{...m.WEAPON_PARTS.vertical_grip,id:'p2'}}};
            const fx=m.weaponPartEffects(gripWeapon);
            if(!(fx.recoilMult<1&&fx.spreadMult<1)) throw new Error('grip effects missing');
            const overlaps=(a,o)=>{const cx=Math.max(o.x,Math.min(a.x,o.x+o.w)),cy=Math.max(o.y,Math.min(a.y,o.y+o.h));return (a.x-cx)**2+(a.y-cy)**2<(a.r||13)**2};
            for(let mapIndex=0;mapIndex<3;mapIndex++) for(let seed=1;seed<=40;seed++){
              const w=m.createWorld({players:[],aiCount:8,mapIndex,coverSeed:seed*7919});
              for(const a of w.actors.filter(x=>x.kind!=='player')){
                for(const o of w.obstacles){if(o.kind==='water'&&w.map.waterPassable)continue;if(overlaps(a,o))throw new Error(`AI overlaps obstacle map=${mapIndex} seed=${seed}`)}
              }
            }
            console.log('v3.4 stress checks passed');
          })
          NODE
      - name: Commit reviewed build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sim.js
          git commit -m 'fix: honor AI extended magazines and stress-check spawns' || exit 0
          git push
