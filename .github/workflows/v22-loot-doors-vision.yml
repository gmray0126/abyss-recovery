name: Apply v2.2 loot doors vision patch
on:
  push:
    paths:
      - '.github/workflows/v22-loot-doors-vision.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: |
          python tools/v22_patch.py
          node --check src/sim.js
          node --check src/main.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sim.js src/main.js
          git rm tools/v22_patch.py .github/workflows/v22-loot-doors-vision.yml
          git commit -m 'v2.2: fix loot, add doors, hide objects outside vision'
          git push
