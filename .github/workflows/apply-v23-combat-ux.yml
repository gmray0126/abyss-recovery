name: Apply v2.3 combat UX
on:
  push:
    paths:
      - 'tools/patch_v23b_combat_ux.py'
      - '.github/workflows/apply-v23-combat-ux.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python tools/patch_v23b_combat_ux.py
          node --check src/main.js
          node --check src/sim.js
      - name: Commit game changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/sim.js index.html
          git rm tools/patch_v23_combat_ux.py tools/patch_v23b_combat_ux.py .github/workflows/apply-v23-combat-ux.yml
          git commit -m 'feat: add 2s healing pointer lock muzzle cues and footsteps'
          git push
