name: Fix loot click stability
on:
  push:
    paths:
      - '.github/workflows/fix-loot-click.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stable loot UI
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check src/main.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js
          git rm .github/workflows/fix-loot-click.yml
          git commit -m 'fix: stabilize loot and bag buttons between snapshots'
          git push
