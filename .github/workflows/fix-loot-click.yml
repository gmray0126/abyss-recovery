name: Fix loot click stability
on:
  push:
    paths:
      - '.github/workflows/fix-loot-click.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loot buttons
        run: |
          python tools/fix_loot_click.py
          node --check src/main.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js
          git rm .github/workflows/fix-loot-click.yml tools/fix_loot_click.py
          git commit -m 'fix: make loot buttons respond immediately'
          git push
