name: Fix raid vision
on:
  push:
    paths:
      - '.github/workflows/fix-vision.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brighten darkness mask
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.js')
          s=p.read_text(encoding='utf-8')
          new="""function drawDarkness(cam){if(!snap?.player)return;const p=snap.player,sx=p.x-cam.x,sy=p.y-cam.y,level=p.visionLevel,near=170+level*36,far=near+520+level*60,half=1.08;ctx.save();ctx.fillStyle='rgba(3,6,9,.72)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.globalCompositeOperation='destination-out';let g=ctx.createRadialGradient(sx,sy,20,sx,sy,near);g.addColorStop(0,'rgba(0,0,0,.96)');g.addColorStop(.68,'rgba(0,0,0,.82)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,near,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(sx,sy);ctx.rotate(p.angle);const cone=ctx.createRadialGradient(0,0,near*.35,0,0,far);cone.addColorStop(0,'rgba(0,0,0,.98)');cone.addColorStop(.58,'rgba(0,0,0,.88)');cone.addColorStop(.84,'rgba(0,0,0,.55)');cone.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=cone;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,far,-half,half);ctx.closePath();ctx.fill();ctx.restore();ctx.restore();const vign=ctx.createRadialGradient(canvas.width/2,canvas.height/2,320,canvas.width/2,canvas.height/2,800);vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,0,.18)');ctx.fillStyle=vign;ctx.fillRect(0,0,canvas.width,canvas.height)}
function drawSoundIndicators"""
          s2,n=re.subn(r"function drawDarkness\(cam\)\{.*?\}\nfunction drawSoundIndicators",new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'drawDarkness patch matches={n}')
          p.write_text(s2,encoding='utf-8')
          PY
          node --check src/main.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js
          git rm .github/workflows/fix-vision.yml
          git commit -m 'fix: make night vision playable'
          git push
