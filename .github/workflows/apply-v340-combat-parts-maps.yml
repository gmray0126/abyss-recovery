name: Apply v3.4 combat parts maps
on:
  push:
    branches:
      - feat/v340-combat-parts-maps
    paths:
      - 'tools/patch_v340_combat_parts_maps.py'
      - '.github/workflows/apply-v340-combat-parts-maps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and checks
        run: |
          python tools/patch_v340_combat_parts_maps.py
          node --check src/sim.js
          node --check src/net.js
          node --check src/main.js
          node --check api/realtime.js
          node --check cloudflare/worker.js
          node -e "import('./src/sim.js').then(m=>{const weapon={kind:'weapon',type:'ar',name:'AK-12 돌격소총',ammo:0,ammoTier:1,damage:24,value:820,parts:{mag:{...m.WEAPON_PARTS.ext_mag,id:'p1'}}};if(m.weaponMagCapacity(weapon)!==42)throw new Error('extended mag failed');const w=m.createWorld({players:[{equipment:{primary:weapon}}],aiCount:7,mapIndex:1,coverSeed:123});if(w.map.id!=='harbor'||!w.map.waterPassable)throw new Error('harbor traits failed');for(const a of w.actors.filter(x=>x.kind!=='player'))for(const o of w.obstacles.filter(x=>x.kind!=='water'))if(a.x>o.x&&a.x<o.x+o.w&&a.y>o.y&&a.y<o.y+o.h)throw new Error('AI center inside obstacle');console.log('v340 smoke ok')})"
      - name: Commit build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sim.js src/net.js src/main.js api/realtime.js cloudflare/worker.js
          git commit -m 'feat: add reconnect recovery weapon parts recoil and map traits' || exit 0
          git push
