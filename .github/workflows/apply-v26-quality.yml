name: Apply v2.6 quality patch
on:
  push:
    paths:
      - '.github/workflows/apply-v26-quality.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-v26-quality.mjs')
          s=p.read_text()
          s=s.replace("it.kind==='ammo'?.75:it.kind==='weapon'?.65:.7", "it.kind==='ammo' ? .75 : it.kind==='weapon' ? .65 : .7")
          start=s.index("  ['blocked door toast',")
          end=s.index("  ['sprint hud state',", start)
          s=s[:start]+s[end:]
          p.write_text(s)
          PY
          node --check tools/apply-v26-quality.mjs
      - name: Apply patch
        run: |
          node tools/apply-v26-quality.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          old="if(e.type==='door')toast(`${e.name} ${e.open?'열림':'닫힘'}`);"
          new=old+"if(e.type==='door_blocked')toast(`${e.name} · 사람이 있어 닫을 수 없음`);"
          if old not in s:
              raise SystemExit('door toast target missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/sim.js
          node --check src/net.js
          node --check api/realtime.js
          node --check cloudflare/worker.js
      - name: Commit v2.6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/sim.js src/net.js api/realtime.js cloudflare/worker.js index.html styles.css tools/apply-v26-quality.mjs
          git commit -m 'feat: smoother combat feedback economy and door safety' || exit 0
          git push
