name: Apply v3.2 mobile onboarding
on:
  push:
    paths:
      - 'tools/apply-v320-mobile-onboarding.mjs'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node tools/apply-v320-mobile-onboarding.mjs
      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/sim.js
          node --check src/net.js
          node --check api/realtime.js
      - name: Mobile and guide guards
        run: |
          grep -q "mobileControls" index.html
          grep -q "RAID 기본 흐름" index.html
          grep -q "TOUCH_MODE" src/main.js
          grep -q "touchAim" src/main.js
          grep -q "pointer:coarse" styles.css
          grep -q "오른쪽 스틱" index.html
      - name: Commit generated patch
        run: |
          if git diff --quiet -- index.html styles.css src/main.js; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css src/main.js
          git commit -m "feat: add mobile controls and clearer raid onboarding"
          git push
