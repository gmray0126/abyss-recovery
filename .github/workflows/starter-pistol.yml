name: Add guaranteed starter pistol
on:
  push:
    paths:
      - '.github/workflows/starter-pistol.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch starter pistol insurance
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/starter_patch.py
          python /tmp/starter_patch.py
          node --check src/main.js
      - name: Commit starter pistol fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js
          git rm .github/workflows/starter-pistol.yml
          git commit -m 'fix: guarantee one free starter M9 in lobby'
          git push
