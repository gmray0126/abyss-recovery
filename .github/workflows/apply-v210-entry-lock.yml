name: Apply v2.10 final minute entry lock
on:
  push:
    paths: ['tools/apply-v210-entry-lock.mjs']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/apply-v210-entry-lock.mjs
      - run: node --check api/realtime.js
      - run: node --check cloudflare/worker.js
      - run: node --check src/main.js
      - name: Commit verified patch
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply-v210-entry-lock.mjs .github/workflows/apply-v210-entry-lock.yml
          git add api/realtime.js cloudflare/worker.js src/main.js
          git commit -m 'fix: lock raid entry during final minute'
          git push
