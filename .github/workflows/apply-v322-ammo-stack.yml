name: Apply v3.2.2 ammo stacking
on:
  push:
    paths:
      - '.github/workflows/apply-v322-ammo-stack.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch ammo stacking and mobile fullscreen
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const must=(text,needle,label)=>{if(!text.includes(needle))throw new Error(label+' anchor missing')};

          let sim=fs.readFileSync('src/sim.js','utf8');
          must(sim,"export const AMMO_CALIBERS={",'ammo calibers');
          if(!sim.includes('export const AMMO_STACK_MAX=999;')){
            const end=" '12g':{name:'12게이지',pack:12}\n};";
            must(sim,end,'ammo calibers end');
            sim=sim.replace(end,end+"\nexport const AMMO_STACK_MAX=999;");
          }
          const normEnd="function normalizeItem(it){const x=copy(it);if(!x.id)x.id=uid('i');if(x.kind==='weapon'){const d=WEAPONS[x.type];x.name=x.name||d.name;x.ammo=x.ammo??d.mag;x.ammoTier=x.ammoTier||1;x.reserve=0;x.damage=x.damage??d.damage;x.value=x.value??d.price}else if(x.kind==='ammo'){x.caliber=x.caliber||WEAPONS[x.type]?.caliber||'9mm';x.tier=Math.max(1,Math.min(5,Number(x.tier)||1));x.qty=Math.max(0,Number(x.qty)||0);x.name=x.name||`${AMMO_CALIBERS[x.caliber]?.name||x.caliber} T${x.tier} 탄약`;x.value=x.value??Math.round(x.qty*(AMMO_TIERS[x.tier]?.unitPrice||3))}return x}";
          must(sim,normEnd,'normalize item');
          if(!sim.includes('function addItemToInventoryStacked(')){
            const helpers=`\nfunction ammoStackMatch(a,b){return a?.kind==='ammo'&&b?.kind==='ammo'&&a.caliber===b.caliber&&(a.tier||1)===(b.tier||1)&&!!a.starterIssue===!!b.starterIssue}\nfunction syncAmmoStackValue(it){if(it?.kind!=='ammo')return it;it.qty=Math.max(0,Math.floor(Number(it.qty)||0));it.value=it.starterIssue?0:Math.round(it.qty*(AMMO_TIERS[it.tier||1]?.unitPrice||3));return it}\nfunction addItemToInventoryStacked(inventory,raw,maxSlots=Infinity){const item=normalizeItem(raw);if(item.kind!=='ammo'){if(inventory.length>=maxSlots)return{movedQty:0,remainder:1};inventory.push(item);return{movedQty:1,remainder:0}}let remaining=Math.max(0,item.qty||0),start=remaining;for(const stack of inventory){if(remaining<=0)break;if(!ammoStackMatch(stack,item)||(stack.qty||0)>=AMMO_STACK_MAX)continue;const add=Math.min(remaining,AMMO_STACK_MAX-(stack.qty||0));stack.qty=(stack.qty||0)+add;remaining-=add;syncAmmoStackValue(stack)}while(remaining>0&&inventory.length<maxSlots){const add=Math.min(remaining,AMMO_STACK_MAX);inventory.push(syncAmmoStackValue({...item,id:uid('a'),qty:add}));remaining-=add}return{movedQty:start-remaining,remainder:remaining}}\nfunction compactInventoryStacks(items,maxSlots=Infinity){const out=[];for(const it of items||[])addItemToInventoryStacked(out,it,maxSlots);return out}\n`;
            sim=sim.replace(normEnd,normEnd+helpers);
          }
          sim=sim.replace("const inventory=(load.inventory||[]).map(normalizeItem);","const inventory=compactInventoryStacks(load.inventory||[]);");
          sim=sim.replace("const take=Math.min(left,it.qty||0);it.qty-=take;left-=take;if(it.qty<=0)a.inventory.splice(i,1)","const take=Math.min(left,it.qty||0);it.qty-=take;left-=take;syncAmmoStackValue(it);if(it.qty<=0)a.inventory.splice(i,1)");
          const lootRe=/else if\(action\.type===ACTIONS\.LOOT\)\{.*?\}else if\(action\.type===ACTIONS\.EQUIP_BAG\)/s;
          if(!lootRe.test(sim))throw new Error('loot action anchor missing');
          sim=sim.replace(lootRe,`else if(action.type===ACTIONS.LOOT){const c=getContainer(w,action.containerId||w.openContainers[id]);if(!c||dist(p,c)>145)return;const i=c.items.findIndex(x=>x.id===action.itemId);if(i<0)return;const source=c.items[i];if(source.kind==='ammo'){const moved=addItemToInventoryStacked(p.inventory,source,bagCapacity(p));if(!moved.movedQty)return;source.qty=moved.remainder;syncAmmoStackValue(source);if(source.qty<=0)c.items.splice(i,1);w.openContainers[id]=c.id;emit(w,'loot',{recipient:id,item:\`${'${source.name}'} +${'${moved.movedQty}'}발\`,itemId:source.id})}else{if(p.inventory.length>=bagCapacity(p))return;const it=c.items.splice(i,1)[0];p.inventory.push(normalizeItem(it));w.openContainers[id]=c.id;emit(w,'loot',{recipient:id,item:it.name,itemId:it.id})}}else if(action.type===ACTIONS.EQUIP_BAG)`);
          fs.writeFileSync('src/sim.js',sim);

          let main=fs.readFileSync('src/main.js','utf8');
          main=main.replace("import {WEAPONS,GEAR,AMMO_TIERS,AMMO_CALIBERS} from './sim.js';","import {WEAPONS,GEAR,AMMO_TIERS,AMMO_CALIBERS,AMMO_STACK_MAX} from './sim.js';");
          const makeAmmoLine="const makeAmmo=(caliber,tier=1,qty=AMMO_CALIBERS[caliber]?.pack||30,starterIssue=false)=>({id:id(),kind:'ammo',caliber,tier,qty,name:`${AMMO_CALIBERS[caliber]?.name||caliber} T${tier} 탄약`,value:starterIssue?0:ammoPrice(caliber,tier,qty),starterIssue});";
          must(main,makeAmmoLine,'makeAmmo');
          if(!main.includes('function addMetaItemStacked(')){
            const metaHelpers=`\nfunction metaAmmoMatch(a,b){return a?.kind==='ammo'&&b?.kind==='ammo'&&a.caliber===b.caliber&&(a.tier||1)===(b.tier||1)&&!!a.starterIssue===!!b.starterIssue}\nfunction syncMetaAmmoValue(it){if(it?.kind!=='ammo')return it;it.qty=Math.max(0,Math.floor(Number(it.qty)||0));it.value=it.starterIssue?0:ammoPrice(it.caliber,it.tier||1,it.qty);return it}\nfunction addMetaItemStacked(list,raw,maxSlots=Infinity){if(!raw)return 0;if(raw.kind!=='ammo'){if(list.length>=maxSlots)return 0;list.push(raw);return 1}let remaining=Math.max(0,Math.floor(Number(raw.qty)||0)),start=remaining;for(const stack of list){if(remaining<=0)break;if(!metaAmmoMatch(stack,raw)||(stack.qty||0)>=AMMO_STACK_MAX)continue;const add=Math.min(remaining,AMMO_STACK_MAX-(stack.qty||0));stack.qty=(stack.qty||0)+add;remaining-=add;syncMetaAmmoValue(stack)}while(remaining>0&&list.length<maxSlots){const add=Math.min(remaining,AMMO_STACK_MAX);list.push(syncMetaAmmoValue({...cp(raw),id:id(),qty:add}));remaining-=add}return start-remaining}\nfunction compactMetaAmmo(list){const out=[];for(const it of list||[])addMetaItemStacked(out,it);return out}\nfunction canMetaReceive(list,it,maxSlots=Infinity){if(!it)return false;if(it.kind!=='ammo')return list.length<maxSlots;return list.length<maxSlots||list.some(x=>metaAmmoMatch(x,it)&&(x.qty||0)<AMMO_STACK_MAX)}\nfunction transferMetaItem(src,index,dst,maxSlots=Infinity){const it=src[index];if(!it)return 0;if(it.kind!=='ammo'){if(dst.length>=maxSlots)return 0;dst.push(src.splice(index,1)[0]);return 1}const moved=addMetaItemStacked(dst,it,maxSlots);if(moved<=0)return 0;it.qty-=moved;syncMetaAmmoValue(it);if(it.qty<=0)src.splice(index,1);return moved}\n`;
            main=main.replace(makeAmmoLine,makeAmmoLine+metaHelpers);
          }
          main=main.replace("migrateAmmoEconomy();","migrateAmmoEconomy();\nmeta.inventory=compactMetaAmmo(meta.inventory);meta.stash=compactMetaAmmo(meta.stash);save();");
          main=main.replace("meta.stash.push(makeAmmo('9mm',1,15,true));","addMetaItemStacked(meta.stash,makeAmmo('9mm',1,15,true));");
          main=main.replace("function stashToInventory(i){if(meta.inventory.length>=12)return;meta.inventory.push(meta.stash.splice(i,1)[0]);save();renderLobby()}","function stashToInventory(i){if(!transferMetaItem(meta.stash,i,meta.inventory,12))return;save();renderLobby()}");
          main=main.replace("function inventoryToStash(i){meta.stash.push(meta.inventory.splice(i,1)[0]);save();renderLobby()}","function inventoryToStash(i){if(!transferMetaItem(meta.inventory,i,meta.stash))return;save();renderLobby()}");
          main=main.replace("b.disabled=meta.inventory.length>=12;b.onclick=()=>stashToInventory(i)","b.disabled=!canMetaReceive(meta.inventory,it,12);b.onclick=()=>stashToInventory(i)");
          main=main.replace("meta.stash.push(makeAmmo(cal,tier));save();renderLobby()","addMetaItemStacked(meta.stash,makeAmmo(cal,tier));save();renderLobby()");
          main=main.replace("meta.equipment=r.equipment||{primary:null,secondary:null,armor:null,helmet:null,backpack:null};const cap=12;const items=r.items||[];meta.inventory=items.slice(0,cap);if(items.length>cap)meta.stash.push(...items.slice(cap));save()","meta.equipment=r.equipment||{primary:null,secondary:null,armor:null,helmet:null,backpack:null};const cap=12,items=compactMetaAmmo(r.items||[]);meta.inventory=items.slice(0,cap);for(const it of items.slice(cap))addMetaItemStacked(meta.stash,it);save()");
          main=main.replace("`${AMMO_CALIBERS[it.caliber]?.name||it.caliber} · T${it.tier||1} · ${it.qty||0}발 · 해당 탄 사용 시 무기 피해 ×${(t?.damageMult||1).toFixed(2)}`","`${AMMO_CALIBERS[it.caliber]?.name||it.caliber} · T${it.tier||1} · ${it.qty||0}/${AMMO_STACK_MAX}발 · 해당 탄 사용 시 무기 피해 ×${(t?.damageMult||1).toFixed(2)}`");
          const renderLootOld="function renderLoot(){const p=$('#lootPanel'),c=snap.openContainer;if(!c){if(hudLootKey){hudLootKey='';p.classList.add('hidden')}return}const key=c.id+'|'+c.items.map(i=>i.id).join(',')+'|'+snap.player.inventory.length+'/'+snap.player.bagCapacity;if(key===hudLootKey)return;hudLootKey=key;";
          must(main,renderLootOld,'renderLoot');
          const renderLootNew="function canRaidReceive(it,p){if(!it||!p)return false;if(it.kind!=='ammo')return p.inventory.length<p.bagCapacity;return p.inventory.length<p.bagCapacity||p.inventory.some(x=>metaAmmoMatch(x,it)&&(x.qty||0)<AMMO_STACK_MAX)}\nfunction renderLoot(){const p=$('#lootPanel'),c=snap.openContainer;if(!c){if(hudLootKey){hudLootKey='';p.classList.add('hidden')}return}const key=c.id+'|'+c.items.map(i=>`${i.id}:${i.qty??''}:${i.tier??''}`).join(',')+'|'+snap.player.inventory.map(i=>`${i.id}:${i.qty??''}`).join(',')+'/'+snap.player.bagCapacity;if(key===hudLootKey)return;hudLootKey=key;";
          main=main.replace(renderLootOld,renderLootNew);
          main=main.replace("b.disabled=snap.player.inventory.length>=snap.player.bagCapacity;b.onpointerdown", "b.disabled=!canRaidReceive(it,snap.player);b.onpointerdown");
          fs.writeFileSync('src/main.js',main);

          let html=fs.readFileSync('index.html','utf8');
          if(!html.includes('mobile-fullscreen.css'))html=html.replace('<link rel="stylesheet" href="./styles.css">','<link rel="stylesheet" href="./styles.css">\n<link rel="stylesheet" href="./mobile-fullscreen.css">');
          html=html.replace('<title>DEAD DROP // v3.2 Mobile Controls & Raid Guide</title>','<title>DEAD DROP // v3.2.2 Ammo Stack & Mobile Fullscreen</title>');
          html=html.replace('v3.2 · 모바일 전용 트윈스틱 조작 · PC UI 분리 · RAID 진행 설명 강화 · 모바일 가방 패널 · 랜덤 엄폐물','v3.2.2 · 탄약 999발 스택 · 빈 슬롯 없이 탄약 합치기 · 모바일 RAID 전체화면 · 트윈스틱 조작');
          fs.writeFileSync('index.html',html);
          NODE
      - name: Syntax check
        run: |
          node --check src/sim.js
          node --check src/main.js
          node --check src/mobile-fullscreen.js
      - name: Ammo stack regression tests
        run: |
          node --input-type=module <<'NODE'
          import {createWorld,applyAction,AMMO_STACK_MAX} from './src/sim.js';
          import {ACTIONS} from './src/protocol.js';
          const ammo=(id,qty,tier=2)=>({id,kind:'ammo',caliber:'9mm',tier,qty,name:`9mm T${tier} 탄약`,value:qty*5});
          let w=createWorld({players:[{inventory:[ammo('old',38)]}],aiCount:0});
          let pid=w.humanIds[0],p=w.actors.find(a=>a.id===pid),c=w.crates[0];c.x=p.x;c.y=p.y;c.opened=true;c.items=[ammo('pick',52)];
          applyAction(w,pid,{type:ACTIONS.LOOT,containerId:c.id,itemId:'pick'});
          const stacks=p.inventory.filter(x=>x.kind==='ammo'&&x.caliber==='9mm'&&x.tier===2);
          if(stacks.length!==1||stacks[0].qty!==90)throw new Error('38+52 did not merge to 90');
          w=createWorld({players:[{inventory:[ammo('big',990),...Array.from({length:7},(_,i)=>({id:'v'+i,kind:'valuable',name:'v',value:1}))]}],aiCount:0});
          pid=w.humanIds[0];p=w.actors.find(a=>a.id===pid);c=w.crates[0];c.x=p.x;c.y=p.y;c.opened=true;c.items=[ammo('overflow',20)];
          applyAction(w,pid,{type:ACTIONS.LOOT,containerId:c.id,itemId:'overflow'});
          if(p.inventory.length!==8||p.inventory.find(x=>x.id==='big')?.qty!==AMMO_STACK_MAX)throw new Error('full bag stack top-up failed');
          if(c.items[0]?.qty!==11)throw new Error('partial remainder should stay in container');
          w=createWorld({players:[{inventory:[ammo('a',600),ammo('b',600)]}],aiCount:0});
          p=w.actors.find(a=>a.id===w.humanIds[0]);const q=p.inventory.filter(x=>x.kind==='ammo'&&x.tier===2).map(x=>x.qty).sort((a,b)=>b-a);
          if(q.length!==2||q[0]!==999||q[1]!==201)throw new Error('raid-start compaction failed');
          console.log('ammo stack tests OK');
          NODE
      - name: Guards
        run: |
          grep -q 'AMMO_STACK_MAX=999' src/sim.js
          grep -q 'canRaidReceive' src/main.js
          grep -q 'mobile-fullscreen.css' index.html
          grep -q 'mobile-fullscreen.js' index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v322-ammo-stack.yml
          git add src/sim.js src/main.js index.html
          git commit -m "feat: stack ammo to 999 and restore mobile fullscreen"
          git push