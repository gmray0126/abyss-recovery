name: Apply v3.5 arsenal secure slot
on:
  push:
    branches:
      - feat/v350-arsenal-secure-slot
    paths:
      - 'tools/patch_v350_arsenal_secure.py'
      - '.github/workflows/apply-v350-arsenal-secure.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.5 patch
        run: python tools/patch_v350_arsenal_secure.py
      - name: Syntax checks
        run: |
          node --check src/sim.js
          node --check src/net.js
          node --check src/main.js
          node --check src/protocol.js
          node --check api/realtime.js
      - name: Arsenal and secure-slot smoke tests
        run: |
          node --input-type=module <<'NODE'
          import {WEAPONS,WEAPON_PARTS,weaponPartEffects,weaponMagCapacity,weaponReloadTime,createWorld,applyAction,removeHumanPlayer} from './src/sim.js';
          if(Object.keys(WEAPONS).length < 11) throw new Error('weapon count too low');
          if(Object.keys(WEAPON_PARTS).length < 20) throw new Error('part count too low');
          const rifle={kind:'weapon',type:'m4',parts:{mag:{...WEAPON_PARTS.ext_quickdraw},muzzle:{...WEAPON_PARTS.suppressor},stock:{...WEAPON_PARTS.heavy_stock}}};
          const fx=weaponPartEffects(rifle);
          if(!(weaponMagCapacity(rifle)>WEAPONS.m4.mag)) throw new Error('extended quickdraw mag failed');
          if(!(weaponReloadTime(rifle)<WEAPONS.m4.reload)) throw new Error('quickdraw reload failed');
          if(!(fx.soundMult<1&&fx.recoilMult<1&&fx.moveMult<1)) throw new Error('attachment effects failed');
          const safe={id:'safe-loot',kind:'valuable',name:'SAFE',value:1000};
          const risk={id:'risk-loot',kind:'valuable',name:'RISK',value:1000};
          const w=createWorld({players:[{inventory:[safe,risk]}],aiCount:0,mapIndex:0,coverSeed:55});
          const pid=w.humanIds[0];
          applyAction(w,pid,{type:'secure_item',itemId:'safe-loot'});
          const snap=(await import('./src/sim.js')).buildSnapshot(w,pid);
          if(snap.player.secureItemId!=='safe-loot') throw new Error('secure designation failed');
          removeHumanPlayer(w,pid,{drop:true});
          const corpse=w.corpses.at(-1);
          if(corpse.items.some(i=>i.id==='safe-loot')) throw new Error('secure item dropped on corpse');
          if(!corpse.items.some(i=>i.id==='risk-loot')) throw new Error('normal item did not drop');
          console.log(`v3.5 ok: ${Object.keys(WEAPONS).length} guns / ${Object.keys(WEAPON_PARTS).length} parts`);
          NODE
      - name: Commit generated game code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sim.js src/main.js src/net.js src/protocol.js
          git commit -m 'feat: expand arsenal attachments and add secure inventory slot' || exit 0
          git push