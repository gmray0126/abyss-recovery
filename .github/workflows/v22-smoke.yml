name: V2.2 smoke test
on:
  push:
    paths:
      - '.github/workflows/v22-smoke.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final door visibility fix
        run: |
          python tools/v22_smoke_fix.py
          node --check src/sim.js
          node --check src/main.js
      - name: Smoke test loot and door interaction
        run: |
          printf '{"type":"module"}\n' > package.json
          node --input-type=module <<'JS'
          import {createWorld,setPlayerInput,stepWorld,buildSnapshot,applyAction} from './src/sim.js';
          import {ACTIONS,emptyInput} from './src/protocol.js';
          const w=createWorld({players:[{}]});
          const pid=w.humanIds[0],p=w.actors.find(a=>a.id===pid);
          for(const a of w.actors)if(a.id!==pid)a.dead=true;
          const c=w.crates[0];p.x=c.x;p.y=c.y+28;
          setPlayerInput(w,pid,{...emptyInput(),interact:true});stepWorld(w,1.2);
          let snap=buildSnapshot(w,pid);
          if(!snap.openContainer||!snap.openContainer.items.length)throw new Error('crate did not open');
          const before=p.inventory.length,it=snap.openContainer.items[0];
          applyAction(w,pid,{type:ACTIONS.LOOT,itemId:it.id,containerId:snap.openContainer.id});
          if(p.inventory.length!==before+1)throw new Error('loot did not enter inventory');
          setPlayerInput(w,pid,{...emptyInput(),interact:false});stepWorld(w,.05);
          const d=w.doors[0];p.x=d.x+d.w/2-55;p.y=d.y+d.h/2;
          setPlayerInput(w,pid,{...emptyInput(),interact:true});stepWorld(w,.05);
          if(!d.open)throw new Error('door did not open');
          console.log('smoke ok: loot acquired and door opened');
          JS
          rm package.json
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sim.js
          git rm tools/v22_smoke_fix.py .github/workflows/v22-smoke.yml
          git commit -m 'fix: verify loot pickup and visible interactive doors'
          git push
