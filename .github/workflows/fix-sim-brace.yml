name: Repair sim module syntax
on:
  push:
    paths:
      - '.github/workflows/fix-sim-brace.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stray brace
        run: |
          sed -i 's/half:1.05}}}/half:1.05}}/' src/sim.js
          node --check src/sim.js
          node --check src/main.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sim.js
          git rm .github/workflows/fix-sim-brace.yml
          git commit -m 'fix: repair sim module syntax and restore lobby'
          git push
