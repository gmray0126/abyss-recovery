name: Check Cloudflare realtime
on:
  push:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/check-cloudflare-realtime.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check cloudflare/worker.js
          node --check src/sim.js
          node --check src/net.js
