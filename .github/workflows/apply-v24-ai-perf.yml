name: Apply v2.4 AI doors and performance
on:
  push:
    paths:
      - 'tools/patch_v24_ai_perf.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and validate
        run: |
          python tools/patch_v24_ai_perf.py
          node --check src/main.js
          node --check src/sim.js
          node --check src/net.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/sim.js src/net.js
          git commit -m 'perf: smooth simulation and let AI open doors' || exit 0
          git push
