name: Revert gunfire to synth
on:
  push:
    paths: ['tools/revert-v29-gun-synth.mjs']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/revert-v29-gun-synth.mjs
      - run: node --check src/main.js
      - name: Commit verified patch
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/revert-v29-gun-synth.mjs .github/workflows/revert-v29-gun-synth.yml
          git add src/main.js
          git commit -m 'fix: restore synthesized gunfire'
          git push
