name: Apply v2.6.1 hotfix
on:
  push:
    paths:
      - 'tools/apply-v261-hotfix.mjs'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hotfix
        run: node tools/apply-v261-hotfix.mjs
      - name: Syntax check
        run: |
          node --check src/sim.js
          node --check src/main.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply-v261-hotfix.mjs .github/workflows/apply-v261-hotfix.yml
          git add src/sim.js src/main.js
          git commit -m "fix: remove free raid gear tags and sprint camera bob"
          git push
