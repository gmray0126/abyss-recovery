name: Fix darkness layer compositing
on:
  push:
    paths:
      - '.github/workflows/fix-fog-layer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fog rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('src/main.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('function drawDarkness(cam){')
          end=s.index('function drawSoundIndicators()', start)
          new=base64.b64decode('').decode('utf-8')
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          node --check src/main.js
      - name: Commit fog fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js
          git rm .github/workflows/fix-fog-layer.yml
          git commit -m 'fix: brighten vision cone without erasing terrain'
          git push
