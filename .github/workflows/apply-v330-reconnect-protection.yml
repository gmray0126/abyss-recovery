name: Apply v3.3.0 reconnect protection
on:
  push:
    paths:
      - 'tools/patch_v330_reconnect_protection.py'
      - '.github/workflows/apply-v330-reconnect-protection.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reconnect protection patch
        run: |
          python tools/patch_v330_reconnect_protection.py
          node --check src/main.js
          node --check src/net.js
          node --check cloudflare/worker.js
      - name: Commit reconnect protection build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/net.js cloudflare/worker.js
          git commit -m 'feat: add 30 second raid reconnect protection' || exit 0
          git push
