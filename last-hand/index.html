<style>
:root{--bg:#0d1017;--panel:#181d28;--line:#343c50;--text:#f5f1e8;--muted:#9fa8b9;--gold:#e8bd6d;--red:#d85a65;--blue:#78aedd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#30384d 0,#151923 42%,#090b10 100%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button{font:inherit;color:inherit}.game{width:min(1160px,100%);min-height:100vh;margin:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font:800 clamp(26px,4vw,42px) Georgia,serif;letter-spacing:.1em}.brand small{color:var(--muted)}.btn{border:1px solid #46516a;background:#262d3d;border-radius:10px;padding:10px 14px;cursor:pointer}.board{display:grid;grid-template-columns:1fr 280px;gap:12px}.arena,.panel{background:rgba(24,29,40,.96);border:1px solid var(--line);border-radius:16px;overflow:hidden}.enemy{padding:20px;display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line)}.face{width:86px;height:86px;border-radius:16px;display:grid;place-items:center;font-size:42px;background:#2c171d;border:1px solid #6d3c47}.enemyMain{flex:1}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.row h2{margin:0;font-size:23px}.tag{font-size:11px;color:#e7b9c0;border:1px solid #68464c;padding:4px 7px;border-radius:999px}.hpbar{height:14px;background:#0c0f15;border:1px solid #343b4d;border-radius:999px;overflow:hidden;margin-top:10px}.hpbar i{display:block;height:100%;background:#c84e59;width:100%;transition:width .2s}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}.intent{margin-top:11px;padding:10px 12px;background:#261a1e;border:1px solid #57333d;border-radius:10px;display:flex;justify-content:space-between}.intent strong{color:#ffb4b9}.countbox{padding:14px 20px 16px;background:#111620;border-bottom:1px solid var(--line)}.counthead{display:flex;justify-content:space-between;align-items:end}.counthead span{font-size:12px;color:var(--muted)}.counthead strong{font-size:25px;color:#ffd58d}.pips{display:flex;gap:8px;margin-top:9px}.pip{height:18px;flex:1;background:#293142;border:1px solid #424d65;border-radius:7px}.pip.on{background:#d5a955;border-color:#f3cf82;box-shadow:0 0 12px #d5a95555}.pip.danger{background:#b94a56;border-color:#ef7d88;box-shadow:0 0 12px #b94a5655}.explain{font-size:11px;color:#8993a7;margin-top:7px}.log{height:82px;padding:9px 18px;overflow:auto;border-bottom:1px solid var(--line);font-size:12px;color:#c6ccda}.log div{margin:2px 0}.log b{color:var(--gold)}.player{padding:16px}.stats{display:flex;gap:8px;margin-bottom:12px}.stat{min-width:92px;background:#121722;border:1px solid #333c51;border-radius:9px;padding:7px 10px}.stat label{display:block;font-size:10px;color:var(--muted)}.stat b{font-size:19px}.life b{color:#f3d38a}.block b{color:#9cc5eb}.hand{display:flex;justify-content:center;align-items:end;gap:8px;min-height:220px;perspective:900px}.card{position:relative;width:140px;height:205px;padding:8px;border-radius:12px;border:3px solid #e8e0cf;background:linear-gradient(150deg,#e6decf,#c8bda8);color:#20242a;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 11px 20px #0007;transition:.14s;user-select:none}.card:hover{transform:translateY(-10px)}.card.imminent{box-shadow:0 11px 20px #0007,0 0 0 2px #c44e5b}.cost{position:absolute;left:-8px;top:-8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#252c3b;border:3px solid #e8c66f;color:#ffe29a;font-weight:900}.type{text-align:right;font-size:9px;color:#59606d;letter-spacing:.08em}.warn{margin:2px 0 3px;padding:2px 4px;border-radius:5px;background:#f4c7ca;border:1px solid #d49298;color:#a22834;text-align:center;font-size:9px;font-weight:900}.art{height:72px;margin:6px 0;border:1px solid #62605b;border-radius:7px;display:grid;place-items:center;font-size:38px;background:#354151}.card.attack .art{background:#59332f}.card.skill .art{background:#30485a}.card.power .art{background:#4a3955}.card.wounded{background:linear-gradient(150deg,#d1b5ad,#a57b79);border-color:#e2aaa7}.card h3{margin:2px 0 5px;font:700 15px Georgia,"Noto Serif KR",serif}.desc{font-size:11.5px;line-height:1.4;flex:1}.flavor{border-top:1px solid #918777;padding-top:4px;color:#696157;font-size:9px;font-style:italic}.end{text-align:center;margin-top:12px}.hint{text-align:center;color:#7f899d;font-size:11px;margin-top:7px}.side{display:flex;flex-direction:column;gap:12px}.panel{padding:13px}.panel h3{margin:0 0 9px;font-size:12px;color:#d1d6e1;letter-spacing:.07em}.deckviz{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.mini{height:27px;border-radius:4px;background:#d1c5ae;border:1px solid #efe7d8}.mini.w{background:#8d5059;border-color:#bd7982}.counts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.count{background:#111620;border-radius:8px;padding:7px;text-align:center}.count span{display:block;color:var(--muted);font-size:9px}.count b{font-size:18px}.status,.rules{font-size:11.5px;line-height:1.55;color:#bdc5d3}.status{padding:9px;background:#111620;border:1px solid #303a4e;border-radius:8px}.rules b{color:#f1cc7e}.overlay{position:fixed;inset:0;background:#05070add;display:none;place-items:center;padding:20px}.overlay.show{display:grid}.modal{width:min(500px,100%);background:#1a202c;border:1px solid #465169;border-radius:16px;padding:24px}.modal h2{font:800 32px Georgia,serif;margin:0 0 8px}.modal p{color:#c0c7d4;line-height:1.6}.modal .btn{width:100%}
@media(max-width:820px){.game{padding:8px}.board{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.rulesPanel{display:none}.hand{justify-content:flex-start;overflow-x:auto;padding:10px 3px}.card{flex:0 0 125px;height:190px}.face{width:68px;height:68px}.enemy{padding:14px}.countbox{padding:12px 14px}.player{padding:12px}}@media(max-width:520px){.side{grid-template-columns:1fr}.tag{display:none}.stats{overflow-x:auto}.stat{min-width:84px}.brand small{display:none}}

<body>
<div class="game">
 <div class="top"><div class="brand"><h1>LAST HAND</h1><small>COMBAT PROTOTYPE // v0.2</small></div><button class="btn" id="restart">새 전투</button></div>
 <div class="board">
  <main class="arena" id="arena">
   <section class="enemy"><div class="face">☠</div><div class="enemyMain"><div class="row"><h2>잿빛 약탈자</h2><span class="tag">ELITE SCAVENGER</span></div><div class="hpbar"><i id="enemyHpBar"></i></div><div class="meta"><span id="enemyHpText">48 / 48</span><span>방어 <b id="enemyBlock">0</b></span></div><div class="intent"><span>다음 행동: <strong id="intentName">도끼질</strong></span><span id="intentText">8 피해</span></div></div></section>
   <section class="countbox"><div class="counthead"><span>적 행동까지</span><strong><span id="counter">3</span>칸</strong></div><div class="pips" id="pips"></div><div class="explain">카드 왼쪽 위 숫자만큼 줄어듭니다. 0이 되면 적이 즉시 행동합니다.</div></section>
   <section class="log" id="log"></section>
   <section class="player"><div class="stats"><div class="stat life"><label>생명 / 정상 카드</label><b id="life">24</b></div><div class="stat block"><label>방어</label><b id="block">0</b></div><div class="stat"><label>덱</label><b id="draw">19</b></div><div class="stat"><label>버린 카드</label><b id="discard">0</b></div></div><div class="hand" id="hand"></div><div class="end"><button class="btn" id="endHand">패 버리고 새 패 뽑기 <small>(행동 1 소모)</small></button></div><div class="hint">빨간 테두리 카드 = 사용하면 적이 바로 행동합니다.</div></section>
  </main>
  <aside class="side"><section class="panel"><h3>당신의 덱 = 생명</h3><div class="deckviz" id="deckviz"></div><div class="counts"><div class="count"><span>정상 카드</span><b id="active">24</b></div><div class="count"><span>부상 카드</span><b id="wounds">0</b></div></div></section><section class="panel"><h3>현재 상태</h3><div class="status" id="status"></div></section><section class="panel rulesPanel"><h3>규칙</h3><div class="rules"><b>피해 1</b> = 정상 카드 1장 부상.<br><b>행동 비용</b>만큼 적 카운트 감소.<br><b>카운트 0</b> = 적 즉시 행동.<br><b>정상 카드 0장</b> = 패배.</div></section></aside>
 </div>
</div>
<div class="overlay" id="overlay"><div class="modal"><h2 id="resultTitle"></h2><p id="resultText"></p><button class="btn" id="again">다시 싸우기</button></div></div>
<script>
const CARDS=[
{name:'빠른 베기',type:'attack',icon:'⚔',cost:1,damage:5,text:'적에게 5 피해.',flavor:'숨을 쉬는 것보다 빠르게.'},{name:'빠른 베기',type:'attack',icon:'⚔',cost:1,damage:5,text:'적에게 5 피해.',flavor:'숨을 쉬는 것보다 빠르게.'},{name:'빠른 베기',type:'attack',icon:'⚔',cost:1,damage:5,text:'적에게 5 피해.',flavor:'숨을 쉬는 것보다 빠르게.'},
{name:'대검 강타',type:'attack',icon:'🗡',cost:3,damage:13,text:'적에게 13 피해.',flavor:'무거운 만큼 확실하다.'},{name:'대검 강타',type:'attack',icon:'🗡',cost:3,damage:13,text:'적에게 13 피해.',flavor:'무거운 만큼 확실하다.'},
{name:'방패 올리기',type:'skill',icon:'◈',cost:1,block:7,text:'방어 7을 얻는다.',flavor:'살아남아야 다음 수가 있다.'},{name:'방패 올리기',type:'skill',icon:'◈',cost:1,block:7,text:'방어 7을 얻는다.',flavor:'살아남아야 다음 수가 있다.'},{name:'방패 올리기',type:'skill',icon:'◈',cost:1,block:7,text:'방어 7을 얻는다.',flavor:'살아남아야 다음 수가 있다.'},
{name:'반격 태세',type:'skill',icon:'⟲',cost:1,block:4,retaliate:5,text:'방어 4. 다음 적 공격 후 5 반격.',flavor:'한 걸음 물러서고 두 걸음 찌른다.'},{name:'반격 태세',type:'skill',icon:'⟲',cost:1,block:4,retaliate:5,text:'방어 4. 다음 적 공격 후 5 반격.',flavor:'한 걸음 물러서고 두 걸음 찌른다.'},
{name:'전투 호흡',type:'power',icon:'✦',cost:2,draw:2,text:'카드 2장을 추가로 뽑는다.',flavor:'흐트러진 리듬을 다시 잡는다.'},{name:'전투 호흡',type:'power',icon:'✦',cost:2,draw:2,text:'카드 2장을 추가로 뽑는다.',flavor:'흐트러진 리듬을 다시 잡는다.'},
{name:'틈새 찌르기',type:'attack',icon:'➶',cost:1,damage:3,draw:1,text:'3 피해. 카드 1장을 뽑는다.',flavor:'작은 상처로 흐름을 잇는다.'},{name:'틈새 찌르기',type:'attack',icon:'➶',cost:1,damage:3,draw:1,text:'3 피해. 카드 1장을 뽑는다.',flavor:'작은 상처로 흐름을 잇는다.'},
{name:'목숨 건 돌진',type:'attack',icon:'☄',cost:2,damage:17,selfWound:2,text:'17 피해. 정상 카드 2장을 부상시킨다.',flavor:'살아남을 생각은 나중에.'},{name:'목숨 건 돌진',type:'attack',icon:'☄',cost:2,damage:17,selfWound:2,text:'17 피해. 정상 카드 2장을 부상시킨다.',flavor:'살아남을 생각은 나중에.'},
{name:'응급 봉합',type:'skill',icon:'✚',cost:2,heal:1,text:'부상 카드 1장을 약화시켜 복구.',flavor:'완벽하지 않아도 살아남는다.'},{name:'응급 봉합',type:'skill',icon:'✚',cost:2,heal:1,text:'부상 카드 1장을 약화시켜 복구.',flavor:'완벽하지 않아도 살아남는다.'},
{name:'무딘 일격',type:'attack',icon:'╱',cost:2,damage:7,text:'적에게 7 피해.',flavor:'좋진 않아도 목숨 하나다.'},{name:'무딘 일격',type:'attack',icon:'╱',cost:2,damage:7,text:'적에게 7 피해.',flavor:'좋진 않아도 목숨 하나다.'},{name:'무딘 일격',type:'attack',icon:'╱',cost:2,damage:7,text:'적에게 7 피해.',flavor:'좋진 않아도 목숨 하나다.'},
{name:'낡은 가죽갑옷',type:'skill',icon:'♜',cost:2,block:11,text:'방어 11을 얻는다.',flavor:'아직 한 번은 막아준다.'},{name:'낡은 가죽갑옷',type:'skill',icon:'♜',cost:2,block:11,text:'방어 11을 얻는다.',flavor:'아직 한 번은 막아준다.'},
{name:'결사의 일격',type:'attack',icon:'✹',cost:3,damage:9,desperate:10,text:'9 피해. 생명 10 이하라면 +10.',flavor:'마지막 한 장까지 검을 놓지 않는다.'}
];
const PATTERN=[{name:'도끼질',damage:8,delay:3},{name:'거친 숨',block:7,delay:2},{name:'찍어 누르기',damage:13,delay:4},{name:'피의 흥분',damage:6,buff:2,delay:2}];
const $=q=>document.querySelector(q);let S;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clone(c,i){return{...c,id:`c${Date.now()}_${i}_${Math.random()}`,wounded:false}}
function life(){return S.draw.length+S.hand.length+S.discard.length}
function log(t){let d=document.createElement('div');d.innerHTML=t;$('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight}
function init(){S={draw:shuffle(CARDS.map(clone)),hand:[],discard:[],wounds:[],block:0,retaliate:0,enemyHp:48,enemyMax:48,enemyBlock:0,enemyIndex:0,enemyPower:0,count:PATTERN[0].delay,over:false};$('#overlay').classList.remove('show');$('#log').innerHTML='';log('전투 시작. <b>정상 카드 24장</b>이 생명입니다.');drawCards(5);render()}
function drawOne(){if(!S.draw.length){if(!S.discard.length)return;S.draw=shuffle(S.discard.splice(0));log('버린 카드 더미를 다시 섞었습니다.')}let c=S.draw.pop();if(c)S.hand.push(c)}
function drawCards(n){for(let i=0;i<n;i++)drawOne()}
function removeActive(){if(S.draw.length)return S.draw.pop();if(S.discard.length)return S.discard.pop();if(S.hand.length)return S.hand.splice(Math.floor(Math.random()*S.hand.length),1)[0]}
function wound(n){for(let i=0;i<n;i++){let c=removeActive();if(!c)break;S.wounds.push({...c,wounded:true})}if(life()<=0)finish(false)}
function hitEnemy(n){let b=Math.min(S.enemyBlock,n);S.enemyBlock-=b;n-=b;if(n>0){S.enemyHp=Math.max(0,S.enemyHp-n);log(`적에게 <b>${n} 피해</b>.`)}else log('적의 방어가 공격을 막았습니다.');if(S.enemyHp<=0)finish(true)}
function takeDamage(n,name){let original=n,b=Math.min(S.block,n);S.block-=b;n-=b;if(b)log(`방어로 <b>${b}</b> 피해 방어.`);if(n>0){wound(n);log(`${name}: 정상 카드 <b>${n}장 부상</b>.`)}if(S.retaliate&&original>0&&!S.over){let r=S.retaliate;S.retaliate=0;log(`반격! <b>${r} 피해</b>.`);hitEnemy(r)}}
function heal(){if(!S.wounds.length){log('복구할 부상이 없습니다.');return}let c=S.wounds.pop();S.discard.push({...c,name:'금 간 '+c.name,damage:c.damage?Math.ceil(c.damage*.65):undefined,block:c.block?Math.ceil(c.block*.65):undefined,wounded:true});log(`<b>${c.name}</b>을 약화된 상태로 복구.`)}
function enemyAct(){let a=PATTERN[S.enemyIndex%PATTERN.length];log(`적 행동: <b>${a.name}</b>`);if(a.damage)takeDamage(a.damage+S.enemyPower,a.name);if(S.over)return;if(a.block){S.enemyBlock+=a.block;log(`적이 방어 <b>${a.block}</b> 획득.`)}if(a.buff){S.enemyPower+=a.buff;log(`적 공격력이 <b>+${a.buff}</b>.`)}S.enemyIndex++;S.count=PATTERN[S.enemyIndex%PATTERN.length].delay;S.block=0}
function spend(cost){let left=cost;while(left>0&&!S.over){if(left<S.count){S.count-=left;left=0}else{left-=S.count;S.count=0;enemyAct()}}}
function play(id){if(S.over)return;let i=S.hand.findIndex(c=>c.id===id);if(i<0)return;let c=S.hand.splice(i,1)[0];S.discard.push(c);log(`<b>${c.name}</b> · 행동 ${c.cost} 소모`);if(c.damage){let d=c.damage+(c.desperate&&life()<=10?c.desperate:0);hitEnemy(d)}if(S.over)return;if(c.block){S.block+=c.block;log(`방어 <b>${c.block}</b> 획득.`)}if(c.retaliate)S.retaliate+=c.retaliate;if(c.draw)drawCards(c.draw);if(c.selfWound){wound(c.selfWound);log(`대가로 정상 카드 <b>${c.selfWound}장 부상</b>.`)}if(c.heal)heal();if(!S.over)spend(c.cost);render()}
function endHand(){if(S.over)return;S.discard.push(...S.hand.splice(0));spend(1);if(!S.over){drawCards(5);log('새 손패를 뽑았습니다.')}render()}
function intent(){return PATTERN[S.enemyIndex%PATTERN.length]}
function renderPips(){let e=$('#pips');e.innerHTML='';for(let i=0;i<4;i++){let p=document.createElement('div');p.className='pip'+(i<S.count?' on':'')+(S.count===1&&i===0?' danger':'');e.appendChild(p)}$('#counter').textContent=S.count}
function renderHand(){let e=$('#hand');e.innerHTML='';if(!S.hand.length){e.innerHTML='<div style="color:#788296;padding:70px 10px">손패가 없습니다.</div>';return}S.hand.forEach(c=>{let trigger=c.cost>=S.count,d=document.createElement('div');d.className=`card ${c.type}${c.wounded?' wounded':''}${trigger?' imminent':''}`;d.onclick=()=>play(c.id);d.innerHTML=`<div class="cost">${c.cost}</div><div class="type">행동 비용</div>${trigger?'<div class="warn">사용 후 적 행동!</div>':''}<div class="art">${c.icon}</div><h3>${c.name}</h3><div class="desc">${c.text}</div><div class="flavor">${c.flavor}</div>`;e.appendChild(d)})}
function renderDeck(){let e=$('#deckviz');e.innerHTML='';let a=life(),w=S.wounds.length;for(let i=0;i<a+w;i++){let m=document.createElement('div');m.className='mini'+(i>=a?' w':'');e.appendChild(m)}}
function render(){if(!S)return;$('#enemyHpText').textContent=`${S.enemyHp} / ${S.enemyMax}`;$('#enemyHpBar').style.width=`${100*S.enemyHp/S.enemyMax}%`;$('#enemyBlock').textContent=S.enemyBlock;$('#life').textContent=life();$('#block').textContent=S.block;$('#draw').textContent=S.draw.length;$('#discard').textContent=S.discard.length;$('#active').textContent=life();$('#wounds').textContent=S.wounds.length;let a=intent(),bits=[];$('#intentName').textContent=a.name;if(a.damage)bits.push(`${a.damage+S.enemyPower} 피해`);if(a.block)bits.push(`방어 ${a.block}`);if(a.buff)bits.push(`공격력 +${a.buff}`);$('#intentText').textContent=bits.join(' · ');$('#status').textContent=life()<=10?'위험: 생명 10 이하. 결사의 일격 강화.':S.wounds.length>=7?'부상이 많습니다. 응급 봉합을 고려하세요.':`적 행동까지 ${S.count}칸. 비용 ${S.count} 이상 카드에는 빨간 경고가 표시됩니다.`;renderPips();renderHand();renderDeck()}
function finish(win){if(S.over)return;S.over=true;setTimeout(()=>{$('#overlay').classList.add('show');$('#resultTitle').textContent=win?'승리':'사망';$('#resultText').innerHTML=win?`남은 정상 카드 <b>${life()}장</b> · 부상 <b>${S.wounds.length}장</b><br><br>다음 단계에서는 이 상태를 들고 맵을 진행합니다.`:`정상 카드가 모두 부상했습니다.<br><br>덱을 얇게 만들수록 강해지지만 최대 생명도 줄어듭니다.`},250)}
$('#restart').onclick=init;$('#again').onclick=init;$('#endHand').onclick=endHand;init();
</script>
